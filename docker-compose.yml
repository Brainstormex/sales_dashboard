version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sales_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/sales.db:/app/backend/sales.db
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sales_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
